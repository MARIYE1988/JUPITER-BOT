<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jupiter Bot Dashboard</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 2rem;
        background: #0f172a;
        color: #e2e8f0;
      }
      .container { max-width: 1200px; margin: 0 auto; }
      h1 { margin-top: 0; color: #60a5fa; }
      h2 { font-size: 1.3rem; color: #93c5fd; margin-top: 2rem; border-bottom: 2px solid #1f2937; padding-bottom: 0.5rem; }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
      @media (max-width: 768px) { .grid, .grid-3 { grid-template-columns: 1fr; } }
      
      label {
        display: block;
        font-weight: 600;
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }
      input, select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #1f2937;
        border-radius: 8px;
        background: #0b1220;
        color: #e2e8f0;
        font-size: 1rem;
      }
      input:focus, select:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }
      
      button {
        background: #2563eb;
        color: white;
        border: 0;
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
        margin-top: 1rem;
      }
      button:hover { background: #1d4ed8; }
      button:disabled {
        background: #4b5563;
        cursor: not-allowed;
      }
      
      button.danger {
        background: #dc2626;
      }
      button.danger:hover {
        background: #b91c1c;
      }
      
      button.success {
        background: #16a34a;
      }
      button.success:hover {
        background: #15803d;
      }
      
      .stat-box {
        background: #0b1220;
        border: 1px solid #1f2937;
        border-radius: 8px;
        padding: 1rem;
        text-align: center;
      }
      .stat-value {
        font-size: 2rem;
        font-weight: bold;
        color: #60a5fa;
        margin: 0.5rem 0;
      }
      .stat-label {
        font-size: 0.85rem;
        color: #9ca3af;
        text-transform: uppercase;
      }
      
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
        font-size: 0.95rem;
      }
      th {
        background: #0b1220;
        text-align: left;
        padding: 0.75rem;
        border-bottom: 2px solid #1f2937;
        font-weight: 600;
      }
      td {
        padding: 0.75rem;
        border-bottom: 1px solid #1f2937;
      }
      tr:hover { background: #0b1220; }
      
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 4px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .badge-success { background: #065f46; color: #86efac; }
      .badge-failure { background: #7f1d1d; color: #fca5a5; }
      .badge-active { background: #1e3a8a; color: #60a5fa; }
      .badge-inactive { background: #3f3f46; color: #a1a1aa; }
      
      .slider-container {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      input[type="range"] {
        width: 100%;
        cursor: pointer;
      }
      .slider-value {
        min-width: 50px;
        text-align: center;
        font-weight: 600;
        color: #60a5fa;
      }
      
      .error {
        background: #7f1d1d;
        border: 1px solid #dc2626;
        color: #fca5a5;
        padding: 0.75rem;
        border-radius: 8px;
        margin-top: 1rem;
        display: none;
      }
      .error.show { display: block; }
      
      .success-msg {
        background: #065f46;
        border: 1px solid #16a34a;
        color: #86efac;
        padding: 0.75rem;
        border-radius: 8px;
        margin-top: 1rem;
        display: none;
      }
      .success-msg.show { display: block; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚀 Jupiter Bot Dashboard</h1>
      
      <!-- Stats -->
      <div class="card">
        <h2>Bot Status</h2>
        <div class="grid-3">
          <div class="stat-box">
            <div class="stat-label">Active Rules</div>
            <div class="stat-value" id="activeRules">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Total Trades</div>
            <div class="stat-value" id="totalTrades">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Success Rate</div>
            <div class="stat-value" id="successRate">0%</div>
          </div>
        </div>
        <div class="grid-3">
          <div class="stat-box">
            <div class="stat-label">Total Fees</div>
            <div class="stat-value" id="totalFees">$0.00</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Wins</div>
            <div class="stat-value" id="winCount">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Losses</div>
            <div class="stat-value" id="lossCount">0</div>
          </div>
        </div>
      </div>

      <!-- Create Rule -->
      <div class="card">
        <h2>Create Trading Rule</h2>
        <div class="grid">
          <div>
            <label>Rule Name</label>
            <input type="text" id="ruleName" placeholder="e.g., SOL to USDC" />
          </div>
          <div>
            <label>Input Token (from wallet)</label>
            <input type="text" id="inputMint" placeholder="e.g., So11111111111111111111111111111111111111112" />
          </div>
        </div>

        <div>
          <label>Output Token</label>
          <select id="outputMint">
            <option value="">Select output token...</option>
            <option value="EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v">USDC</option>
            <option value="Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB">USDT</option>
            <option value="27G9ch6tNiNvSZS8c12tVGmt3fwDMb1NA5aVZ6DM5579">JLP</option>
            <option value="FeKc2btj2vZqLSTjHddxNn2RssdMjcLH8XxC6X7X5Nyb">jupUSD</option>
          </select>
        </div>

        <div class="grid">
          <div>
            <label>Swap Amount (USD)</label>
            <input type="number" id="swapAmount" min="0.25" max="10" step="0.25" value="0.5" />
            <small style="color: #9ca3af;">Range: $0.25 - $10</small>
          </div>
          <div>
            <label>Interval (Minutes)</label>
            <div class="slider-container">
              <input type="range" id="intervalSlider" min="1" max="59" value="5" />
              <div class="slider-value"><span id="intervalValue">5</span> min</div>
            </div>
          </div>
        </div>

        <div>
          <label>Minimum Balance Threshold (USD)</label>
          <div class="grid">
            <div>
              <input type="number" id="thresholdUsd" min="0" step="0.1" placeholder="0 = no threshold" />
              <small style="color: #9ca3af;">Leave 0 for no minimum threshold</small>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button style="flex: 1;" onclick="resetThresholdToEntry()">Reset to Entry Balance</button>
            </div>
          </div>
        </div>

        <button onclick="createRule()">Create Rule</button>
        <div id="createError" class="error"></div>
        <div id="createSuccess" class="success-msg"></div>
      </div>

      <!-- Active Rules -->
      <div class="card">
        <h2>Active Rules</h2>
        <div id="rulesContainer">
          <p style="color: #9ca3af;">No active rules yet. Create one above!</p>
        </div>
      </div>

      <!-- Trade History -->
      <div class="card">
        <h2>Trade History</h2>
        <div id="historyContainer">
          <p style="color: #9ca3af;">No trades yet.</p>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
